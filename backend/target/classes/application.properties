# See http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring.config.import=optional:file:../.env[.properties]

# Core server + datasource (maps from root .env uppercase keys)
spring.application.name=${SPRING_APPLICATION_NAME:KavachOps Ai}
server.port=${SERVER_PORT:8081}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kavachopsai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# JWT config (maps from root .env uppercase keys)
kavachopsai.jwt.secret=${KAVACHOPSAI_JWT_SECRET}
kavachopsai.jwt.expiration=${KAVACHOPSAI_JWT_EXPIRATION:3600000}
kavachopsai.jwt.refresh-expiration=${KAVACHOPSAI_JWT_REFRESH_EXPIRATION:604800000}
kavachopsai.cors.allowed-origins=${KAVACHOPSAI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# VirusTotal is opt-in. The public API limits are enforced in the malware service.
kavachopsai.virustotal.api-key=${KAVACHOPSAI_VIRUSTOTAL_API_KEY:}
kavachopsai.virustotal.enabled=${KAVACHOPSAI_VIRUSTOTAL_ENABLED:false}
kavachopsai.virustotal.base-url=${KAVACHOPSAI_VIRUSTOTAL_BASE_URL:https://www.virustotal.com/api/v3}

# Sarvam analysis of stored Windows event logs (key via imported .env or environment)
kavachopsai.sarvam.model=${KAVACHOPSAI_SARVAM_MODEL:glm5.3}
kavachopsai.bootstrap.admin.enabled=${KAVACHOPSAI_BOOTSTRAP_ADMIN_ENABLED:false}
kavachopsai.bootstrap.admin.username=${KAVACHOPSAI_BOOTSTRAP_ADMIN_USERNAME:admin}
kavachopsai.bootstrap.admin.email=${KAVACHOPSAI_BOOTSTRAP_ADMIN_EMAIL:admin@kavachopsai.local}
kavachopsai.bootstrap.admin.password=${KAVACHOPSAI_BOOTSTRAP_ADMIN_PASSWORD:}

# CVE data is imported explicitly by an administrator unless auto-import is enabled.
kavachopsai.cve.auto-import=${KAVACHOPSAI_CVE_AUTO_IMPORT:false}
kavachopsai.cve.dataset-path=${KAVACHOPSAI_CVE_DATASET_PATH:dataset/nvd_vulnerabilities_with_os.csv}
kavachopsai.vulnerability.nmap-path=${KAVACHOPSAI_VULNERABILITY_NMAP_PATH:C:/Program Files (x86)/Nmap/nmap.exe}
kavachopsai.sarvam.api-key=${KAVACHOPSAI_SARVAM_API_KEY:${SARVAM_API_KEY:}}

spring.thymeleaf.cache=false
spring.main.banner-mode=off
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG

# Python threat-intel microservices (secure defaults: disabled)
python.malware.enabled=false
python.malware.base-url=http://localhost:5000
python.malware.high-confidence-threshold=85.0

python.yara.enabled=false
python.yara.base-url=http://localhost:5000
python.yara.rules-dir=

# HTTP client timeouts for Python microservice calls
python.request.connect-timeout-ms=1500
python.request.read-timeout-ms=2500

# Authenticated gateway from the Java API to the internal Python ML service.
python.ml.base-url=${PYTHON_ML_BASE_URL:http://localhost:5000}
python.ml.connect-timeout-ms=1500
python.ml.read-timeout-ms=90000

# Upload limits for malware scan API
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Windows event catalog (eventdetails.md)
kavachopsai.events.details-path=src/main/java/com/kavachopsai/windows/eventdetails.md

# Honeypot Docker integration
kavachopsai.honeypot.docker.enabled=false
kavachopsai.honeypot.docker.binary=docker
kavachopsai.honeypot.docker.network=
kavachopsai.honeypot.docker.command-timeout-seconds=30
kavachopsai.honeypot.images.cowrie=cowrie/cowrie:latest
kavachopsai.honeypot.images.dionaea=dtagdevsec/dionaea:latest
kavachopsai.honeypot.images.conpot=mushorg/conpot:latest

# Cowrie log ingestion (tail the JSON log file Cowrie writes to var/log/cowrie/cowrie.json)
kavachopsai.honeypot.cowrie.enabled=false
kavachopsai.honeypot.cowrie.log-path=
kavachopsai.honeypot.cowrie.honeypot-name=Cowrie Docker
kavachopsai.honeypot.cowrie.honeypot-type=ssh
kavachopsai.honeypot.cowrie.host-ip=127.0.0.1
kavachopsai.honeypot.cowrie.host-port=2222
kavachopsai.honeypot.cowrie.poll-interval-ms=4000
kavachopsai.honeypot.cowrie.tail-from-end=true

# OWASP ZAP web scanning
kavachopsai.zap.enabled=${KAVACHOPSAI_ZAP_ENABLED:false}
kavachopsai.zap.base-url=${KAVACHOPSAI_ZAP_BASE_URL:http://localhost:8080}
kavachopsai.zap.api-key=${KAVACHOPSAI_ZAP_API_KEY:}
kavachopsai.zap.poll-interval-ms=${KAVACHOPSAI_ZAP_POLL_INTERVAL_MS:2000}
kavachopsai.zap.scan-timeout-seconds=${KAVACHOPSAI_ZAP_SCAN_TIMEOUT_SECONDS:900}
